# Tiny Tapeout project information
project:
  title:        "Flappy Bird VGA Game"
  author:       "Escobar Mamani Alejandra Heidi"
  discord:      "alejandraheidiescobar-ops"    
  description:  "Flappy Bird hardware game with parallax scrolling for TinyVGA PMOD"
  language:     "Verilog"
  clock_hz:     25175000  

  # Occupies a single tile
  tiles: "1x1"

  # Reemplaza 'tu_usuario' por tu usuario real de GitHub
  top_module:  "tt_um_flappy_alejandraheidiescobar-ops"  

  source_files:
    - "flappy_bird.v"
    - "hvsync_generator.v"

# Pinout oficial para TinyVGA PMOD
pinout:
  # Inputs (Entradas)
  ui[0]: "Jump Button P1"
  ui[1]: ""
  ui[2]: "Jump Button P2"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs (Salidas alineadas a TinyVGA PMOD)
  uo[0]: "R0"
  uo[1]: "G0"
  uo[2]: "B0"
  uo[3]: "vsync"
  uo[4]: "R1"
  uo[5]: "G1"
  uo[6]: "B1"
  uo[7]: "hsync"

  # Bidirectional pins (No utilizados)
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
